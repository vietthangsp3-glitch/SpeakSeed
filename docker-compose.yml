services:
  web:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET with at least 32 random characters}
      DB_PATH: /data/speakseed.db
      TTS_CACHE_DIR: /data/audio_cache
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the public HTTPS origin}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set the public host}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_IPS: "127.0.0.1,::1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-2.5-flash}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_LIVE_MAX_SECONDS: ${GEMINI_LIVE_MAX_SECONDS:-600}
      GEMINI_LIVE_MAX_AUDIO_BYTES: ${GEMINI_LIVE_MAX_AUDIO_BYTES:-28000000}
    volumes:
      - speakseed_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  speakseed_data:
