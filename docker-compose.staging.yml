services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speakseed}
      POSTGRES_USER: ${POSTGRES_USER:-speakseed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong staging PostgreSQL password}
    volumes:
      - speakseed_staging_postgres:/var/lib/postgresql/data
    ports:
      # Local-only maintenance port for the explicit migration/verification step.
      - "${STAGING_POSTGRES_BIND_IP:-127.0.0.1}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET with at least 32 random characters}
      AUTH_TRANSPORT: cookie
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-speakseed}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-speakseed}
      ALLOWED_ORIGINS: ${STAGING_ORIGIN:-https://localhost:8443}
      ALLOWED_HOSTS: ${STAGING_HOST:-localhost}
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-2.5-flash}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_LIVE_MAX_SECONDS: ${GEMINI_LIVE_MAX_SECONDS:-600}
      GEMINI_LIVE_MAX_AUDIO_BYTES: ${GEMINI_LIVE_MAX_AUDIO_BYTES:-28000000}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      STAGING_HOST: ${STAGING_HOST:-localhost}
    ports:
      # Loopback is the safe default. Use a private VPN IP only after approval.
      - "${STAGING_BIND_IP:-127.0.0.1}:8443:443"
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - speakseed_staging_caddy_data:/data
      - speakseed_staging_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  speakseed_staging_postgres:
  speakseed_staging_caddy_data:
  speakseed_staging_caddy_config:
